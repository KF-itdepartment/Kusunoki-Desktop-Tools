name: Release desktop applications

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

# The workflow selects a candidate without changing main. Every OS job applies
# and tests that candidate in its own checkout. Only publish, after all build
# jobs and artifact checks pass, may create/push the version commit and tag.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select candidate without publishing
        id: version
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if ! [[ "${current}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package version is not a stable semver: ${current}" >&2
            exit 1
          fi
          tag="v${current}"
          head_subject="$(git log -1 --format=%s)"
          candidate="${current}"
          skip=false
          # A successful publish pushes a [release-version] commit with
          # [skip ci]. If that push event is manually retried after its tag
          # exists, do not create a second release. An untagged marker from a
          # failed historical run is deliberately reusable at this version.
          if [[ "${head_subject}" == *"[release-version]"* ]] && git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            skip=true
          elif git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            candidate="$(node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); console.log(`${major}.${minor}.${patch + 1}`);' "${current}")"
            if git rev-parse --verify --quiet "refs/tags/v${candidate}" >/dev/null; then
              echo "candidate tag v${candidate} already exists" >&2
              exit 1
            fi
          fi
          echo "version=${candidate}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          # Build jobs consume this exact, unchanged base commit and apply the
          # selected version before testing/packaging.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-x64-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply release candidate version in this build
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Package Windows x64 NSIS
        if: matrix.name == 'windows-x64'
        run: npm run pack -- --publish never --win nsis --x64
      - name: Package macOS x64 and arm64 DMG
        if: matrix.name == 'macos-x64-arm64'
        run: npm run pack -- --publish never --mac dmg --x64 --arm64
      - name: Verify macOS architecture-specific DMGs and metadata
        if: matrix.name == 'macos-x64-arm64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          x64_dmgs=(dist/*-x64.dmg)
          arm64_dmgs=(dist/*-arm64.dmg)
          test "${#x64_dmgs[@]}" -eq 1
          test "${#arm64_dmgs[@]}" -eq 1
          test -s "${x64_dmgs[0]}"
          test -s "${arm64_dmgs[0]}"
          test "$(basename "${x64_dmgs[0]}")" != "$(basename "${arm64_dmgs[0]}")"
          # electron-builder currently writes one latest-mac.yml for the last
          # mac target in a multi-arch invocation. Unsigned macOS updates use
          # the release page, so combined metadata is not required. When the
          # metadata is emitted, require it to name at least one DMG produced
          # by this job rather than assuming both architectures are listed.
          test -s dist/latest-mac.yml
          metadata_matches=0
          for dmg in "${x64_dmgs[0]}" "${arm64_dmgs[0]}"; do
            if grep -F -q -- "$(basename "${dmg}")" dist/latest-mac.yml; then
              metadata_matches=$((metadata_matches + 1))
            fi
          done
          test "${metadata_matches}" -ge 1
      - name: Package Linux x64 AppImage
        if: matrix.name == 'linux-x64'
        run: npm run pack -- --publish never --linux AppImage --x64
      - name: Upload installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure main did not advance during the build gate
        env:
          BASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
      - name: Create and push the tested release-version commit
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').version")" = "${RELEASE_VERSION}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore: release v${RELEASE_VERSION} [release-version] [skip ci]"
            git push origin HEAD:main
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create and push the release tag after all builds pass
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release tag ${tag} already exists" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${tag}" "${RELEASE_SHA}" -m "Kusunoki Desktop Tools ${tag}"
          git push origin "${tag}"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish all OS installers and metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Kusunoki Desktop Tools ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/**
