name: Release desktop applications

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

# The workflow creates tags only after the candidate has passed the complete
# test/build gate. The marker on the version commit prevents that commit from
# recursively starting another release.
permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-version]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build the unchanged candidate
        run: |
          set -euo pipefail
          npm test
          npm run build
      - name: Bump only an already-released version, then retest
        id: version
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          candidate="$current"
          if git rev-parse --verify --quiet "refs/tags/v${current}" >/dev/null; then
            npm version patch --no-git-tag-version
            candidate="$(node -p "require('./package.json').version")"
            if git rev-parse --verify --quiet "refs/tags/v${candidate}" >/dev/null; then
              echo "candidate tag v${candidate} already exists" >&2
              exit 1
            fi
            # A version change is itself a candidate and must pass the same
            # gate before either the commit or tag is made permanent.
            npm test
            npm run build
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json
            git commit -m "chore: release v${candidate} [release-version]"
            git push origin HEAD:main
          fi
          echo "version=${candidate}" >> "$GITHUB_OUTPUT"
          # Build jobs consume this exact tested commit. Tag creation is
          # intentionally deferred to publish, after every OS succeeds.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-x64-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package Windows x64 NSIS
        if: matrix.name == 'windows-x64'
        run: npm run pack -- --publish never --win nsis --x64
      - name: Package macOS x64 and arm64 DMG
        if: matrix.name == 'macos-x64-arm64'
        run: npm run pack -- --publish never --mac dmg --x64 --arm64
      - name: Verify macOS architecture-specific DMGs and metadata
        if: matrix.name == 'macos-x64-arm64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          x64_dmgs=(dist/*-x64.dmg)
          arm64_dmgs=(dist/*-arm64.dmg)
          test "${#x64_dmgs[@]}" -eq 1
          test "${#arm64_dmgs[@]}" -eq 1
          test -s "${x64_dmgs[0]}"
          test -s "${arm64_dmgs[0]}"
          test "$(basename "${x64_dmgs[0]}")" != "$(basename "${arm64_dmgs[0]}")"
          test -s dist/latest-mac.yml
          grep -F -- "$(basename "${x64_dmgs[0]}")" dist/latest-mac.yml
          grep -F -- "$(basename "${arm64_dmgs[0]}")" dist/latest-mac.yml
      - name: Package Linux x64 AppImage
        if: matrix.name == 'linux-x64'
        run: npm run pack -- --publish never --linux AppImage --x64
      - name: Upload installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release tag after all builds pass
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "release tag ${tag} already exists" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${tag}" "${RELEASE_SHA}" -m "Kusunoki Desktop Tools ${tag}"
          git push origin "${tag}"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish all OS installers and metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Kusunoki Desktop Tools ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/**
