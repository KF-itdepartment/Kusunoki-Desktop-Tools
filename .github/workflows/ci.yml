name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify generated fallback without private submodules
        env:
          KUSUNOKI_STAGE_FALLBACK: '1'
        run: npm run stage:vendors
      - run: npm run build
      - name: Electron hidden-window smoke
        if: runner.os != 'Linux'
        run: npm run electron:smoke
      - name: Electron hidden-window smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run electron:smoke
