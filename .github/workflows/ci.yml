name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify generated fallback without private submodules
        env:
          KUSUNOKI_STAGE_FALLBACK: '1'
        run: npm run stage:vendors
      - run: npm run build
      - name: Configure Chromium sandbox helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%u:%g' "$sandbox_path")" = "0:0"
          test "$(stat -c '%a' "$sandbox_path")" = "4755"
      - name: Electron hidden-window smoke
        if: runner.os != 'Linux'
        run: npm run electron:smoke
      - name: Electron hidden-window smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run electron:smoke
