name: Sync upstream submodules

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      # The integration repository is public, but all upstream repositories
      # are private. Never ask the default integration token to clone them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect private upstream access
        id: upstream-access
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${UPSTREAM_TOKEN}" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'private upstream sync enabled' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'private upstream sync disabled' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout QR upstream with read-only token
        if: steps.upstream-access.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: KF-itdepartment/QR-Generator
          ref: main
          path: vendor/qr-generator
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Checkout PDF upstream with read-only token
        if: steps.upstream-access.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: KF-itdepartment/pdf-editor
          ref: main
          path: vendor/pdf-editor
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Checkout analytics URL upstream with read-only token
        if: steps.upstream-access.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: KF-itdepartment/analytics_url_generator
          ref: b65e77c8600572f5ddac80b4bc78dde4476b5380
          path: vendor/analytics-url-generator
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Checkout Pic editor upstream with read-only token
        if: steps.upstream-access.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: KF-itdepartment/pic-editor
          ref: 3d7c346
          path: vendor/pic-editor
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.upstream-access.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Test and build upstream candidate
        if: steps.upstream-access.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Commit only a passing candidate to main
        if: steps.upstream-access.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # The gitlinks and generated integration artifacts are one tested
          # candidate. Do not commit a submodule update without its stage.
          git add .gitmodules vendor/qr-generator vendor/pdf-editor vendor/analytics-url-generator vendor/pic-editor renderer/generated renderer/vendor/MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
            exit 0
          fi
          git commit -m "chore: sync upstream submodules"
          git push origin HEAD:main
