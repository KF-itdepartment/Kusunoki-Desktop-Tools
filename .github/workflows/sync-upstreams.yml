name: Sync upstream submodules

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update candidate submodules
        run: |
          set -euo pipefail
          git -C vendor/qr-generator fetch --quiet origin main
          git -C vendor/qr-generator checkout --detach FETCH_HEAD
          git -C vendor/pdf-editor fetch --quiet origin main
          git -C vendor/pdf-editor checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit only a passing candidate to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gitmodules vendor/qr-generator vendor/pdf-editor
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
            exit 0
          fi
          git commit -m "chore: sync upstream submodules"
          git push origin HEAD:main
